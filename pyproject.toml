[project]
name = "dgm-arca"
version = "0.1.0"
description = "ARCA: Agente con Razonamiento, Conocimiento y Acción. Práctica final de Modelos Generativos Profundos (MIA, ICAI)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Equipo docente de Modelos Generativos Profundos, ICAI" }]
dependencies = [
    "pydantic>=2.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "rich>=13.9",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
train = [
    "torch>=2.8,<2.15",
    "transformers>=5.0,<6",
    "trl>=1.13,<2",
    "peft>=0.18",
    "datasets>=3.0",
    "accelerate>=1.5",
    "matplotlib>=3.9",
]
rag = [
    "sentence-transformers>=5.0",
    "chromadb>=1.0",
    "rank-bm25>=0.2.2",
    "langchain-text-splitters>=0.3",
    "pypdf>=5.0",
]
agent = [
    "smolagents>=1.26",
    "gradio>=5.49",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[project.scripts]
arca-api = "api.app:main"
arca-check-gpu = "smoke.check_gpu:main"
arca-smoke = "smoke.smoke_grpo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "rlm", "tool_use", "rag", "agent", "smoke"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
